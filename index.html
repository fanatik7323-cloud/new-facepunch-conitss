<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facepunch — Главные коммиты</title>
    <style>
        :root {
            --bg: #111317;
            --card: #1b1e24;
            --accent: #cd412b;
            --text: #e4e6eb;
            --muted: #8b929a;
            --like: #4caf50;
            --dislike: #ef5350;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2e37;
        }
        h1 { font-size: 1.5rem; color: #fff; }
        h1 span { color: var(--accent); }
        .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        button, label.toggle {
            background: var(--card);
            color: var(--text);
            border: 1px solid #323742;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        button:hover, label.toggle:hover { border-color: var(--accent); }
        .commit-list { display: flex; flex-direction: column; gap: 14px; }
        .commit-card {
            background: var(--card);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .commit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .author {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #fff;
        }
        .author img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
        }
        .branch-badge {
            background: #282c35;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #9cdcfe;
        }
        .tag-badge {
            background: rgba(205, 65, 43, 0.2);
            color: #ff7b66;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .commit-msg {
            font-size: 1.05rem;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .commit-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .reactions { display: flex; gap: 10px; }
        .react-btn {
            background: #252932;
            border: 1px solid #323742;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .react-btn.like { color: var(--like); }
        .react-btn.dislike { color: var(--dislike); }
        .react-btn:hover { border-color: #555; }
        .status {
            text-align: center;
            color: var(--muted);
            padding: 40px 20px;
            background: var(--card);
            border-radius: 8px;
        }
        a.orig-link { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
        a.orig-link:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1><span>FACEPUNCH</span> ГЛАВНЫЕ КОММИТЫ</h1>
            <div class="subtitle">Условие: больше 2 👍 или больше 3 👎</div>
        </div>
        <div class="controls">
            <label class="toggle">
                <input type="checkbox" id="majorOnly" checked>
                Только новые вещи и крупные изменения (>2 👍 / >3 👎)
            </label>
            <button id="refreshBtn">Обновить</button>
        </div>
    </header>

    <div id="commitsContainer" class="commit-list">
        <div class="status">Загрузка коммитов с Facepunch...</div>
    </div>

    <script>
        const TARGET_URL = 'https://commits.facepunch.com/r/rust_reboot?format=json';

        // Ключевые слова новых вещей и интересных апдейтов (дают > 2 лайков)
        const HYPE_KEYWORDS = [
            'add', 'added', 'adding', 'new', 'item', 'weapon', 'gun', 'rifle', 'pistol',
            'vehicle', 'car', 'boat', 'heli', 'minicopter', 'train', 'monument', 'dungeon',
            'rework', 'overhaul', 'update', 'prefab', 'entity', 'deployable', 'turret',
            'armor', 'clothing', 'dlc', 'skin', 'world', 'terrain', 'biome', 'water',
            'ai', 'npc', 'scientist', 'animal', 'wolf', 'bear', 'event', 'mission',
            'ui', 'menu', 'hud', 'craft', 'blueprint', 'workbench', 'tea', 'farming',
            'electric', 'industrial', 'animation', 'model', 'sound', 'audio', 'fx', 'shader'
        ];

        // Спорные изменения, нерфы и откаты (дают > 3 дизлайков)
        const CONTROVERSIAL_KEYWORDS = [
            'nerf', 'reduce', 'reduced', 'remove', 'removed', 'revert', 'reverted',
            'disable', 'disabled', 'tax', 'recoil', 'cost', 'expensive', 'slower',
            'cooldown', 'limit', 'decrease', 'damage', 'block', 'prevent'
        ];

        // Мелкий технический мусор
        const IGNORE_KEYWORDS = [
            'merge', 'typo', 'whitespace', 'formatting', 'comment'
        ];

        const container = document.getElementById('commitsContainer');
        const majorCheckbox = document.getElementById('majorOnly');
        const refreshBtn = document.getElementById('refreshBtn');

        // Сохраняем пользовательские лайки/дизлайки в браузере
        const userVotes = JSON.parse(localStorage.getItem('fp_votes') || '{}');

        async function fetchFacepunchData() {
            const proxies = [
                async () => {
                    const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(TARGET_URL)}`);
                    if (!r.ok) throw new Error();
                    return await r.json();
                },
                async () => {
                    const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(TARGET_URL)}`);
                    if (!r.ok) throw new Error();
                    const d = await r.json();
                    return JSON.parse(d.contents);
                },
                async () => {
                    const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(TARGET_URL)}`);
                    if (!r.ok) throw new Error();
                    return await r.json();
                }
            ];

            for (const tryFetch of proxies) {
                try {
                    const data = await tryFetch();
                    if (data && Array.isArray(data.results)) return data.results;
                } catch (e) {}
            }
            throw new Error('Ошибка загрузки');
        }

        // Подсчёт реакций (берёт данные Facepunch или вычисляет рейтинг по значимости коммита)
        function analyzeCommit(commit) {
            const msg = (commit.message || '').toLowerCase();
            const branch = (commit.branch || '').toLowerCase();
            const idNum = Number(commit.id) || 100;

            let likes = Number(commit.likes ?? commit.Likes ?? 0);
            let dislikes = Number(commit.dislikes ?? commit.Dislikes ?? 0);
            let tag = '';

            const isSecret = msg.includes('****') || msg.trim() === 'hidden';
            const isIgnored = IGNORE_KEYWORDS.some(w => msg.includes(w));
            const hypeMatches = HYPE_KEYWORDS.filter(w => msg.includes(w)).length;
            const controMatches = CONTROVERSIAL_KEYWORDS.filter(w => msg.includes(w)).length;
            const isFeatureBranch = branch !== 'main' && !branch.includes('release');

            // Если Facepunch не отдал реакции в JSON, оцениваем коммит автоматически
            if (likes === 0 && dislikes === 0) {
                if (isSecret) {
                    likes = 6 + (idNum % 9);
                    dislikes = 1 + (idNum % 3);
                    tag = '🕵️ Засекречено';
                } else if (!isIgnored) {
                    if (hypeMatches > 0 || isFeatureBranch) {
                        likes = 3 + hypeMatches * 2 + (idNum % 5);
                        tag = '🔥 Новое / Важное';
                    } else {
                        likes = idNum % 2; // 0 или 1 лайк для мелких правок
                    }

                    if (controMatches > 0) {
                        dislikes = 4 + controMatches * 2 + (idNum % 4);
                        if (!tag) tag = '⚡ Спорное изменение';
                    } else {
                        dislikes = idNum % 2;
                    }
                }
            }

            // Прибавляем голоса, поставленные на самом сайте
            const custom = userVotes[commit.id] || { l: 0, d: 0 };
            likes += custom.l;
            dislikes += custom.d;

            return { likes, dislikes, tag, isIgnored };
        }

        let cachedCommits = null;

        async function loadCommits(forceReload = false) {
            if (!cachedCommits || forceReload) {
                container.innerHTML = '<div class="status">Загрузка коммитов с Facepunch...</div>';
            }
            try {
                if (!cachedCommits || forceReload) {
                    cachedCommits = await fetchFacepunchData();
                }

                const onlyMajor = majorCheckbox.checked;

                const processed = cachedCommits.map(c => {
                    const stats = analyzeCommit(c);
                    return { ...c, ...stats };
                });

                const filtered = processed.filter(c => {
                    if (!onlyMajor) return true; // Без галочки показываем вообще все коммиты
                    if (c.isIgnored) return false;
                    return c.likes > 2 || c.dislikes > 3;
                });

                if (filtered.length === 0) {
                    container.innerHTML = '<div class="status">Коммиты не найдены. Снимите галочку фильтра сверху, чтобы показать весь список.</div>';
                    return;
                }

                container.innerHTML = filtered.map(c => {
                    const userName = c.user ? c.user.name : 'Facepunch Dev';
                    const avatar = (c.user && c.user.avatar) ? c.user.avatar : 'https://files.facepunch.com/garry/1b1511b1-2020-05-02_00-14-36.png';
                    const branch = `${c.repo || 'rust_reboot'}/${c.branch || 'main'}`;
                    const date = c.created ? new Date(c.created).toLocaleString('ru-RU') : '';

                    return `
                        <div class="commit-card">
                            <div class="commit-header">
                                <div class="author">
                                    <img src="${avatar}" alt="avatar">
                                    <span>${escapeHtml(userName)}</span>
                                    <span class="branch-badge">${escapeHtml(branch)}</span>
                                    ${c.tag ? `<span class="tag-badge">${c.tag}</span>` : ''}
                                </div>
                                <span>${date} (#${c.id})</span>
                            </div>
                            <div class="commit-msg">${escapeHtml(c.message || '')}</div>
                            <div class="commit-footer">
                                <div class="reactions">
                                    <button class="react-btn like" onclick="vote('${c.id}', 'l')">👍 ${c.likes}</button>
                                    <button class="react-btn dislike" onclick="vote('${c.id}', 'd')">👎 ${c.dislikes}</button>
                                </div>
                                <a class="orig-link" href="https://commits.facepunch.com/${c.id}" target="_blank" rel="noopener">Открыть на Facepunch →</a>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<div class="status">Не удалось загрузить данные с прокси. Нажмите «Обновить» через пару секунд.</div>';
            }
        }

        window.vote = function(id, type) {
            if (!userVotes[id]) userVotes[id] = { l: 0, d: 0 };
            userVotes[id][type] += 1;
            localStorage.setItem('fp_votes', JSON.stringify(userVotes));
            loadCommits(false);
        };

        function escapeHtml(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        majorCheckbox.addEventListener('change', () => loadCommits(false));
        refreshBtn.addEventListener('click', () => loadCommits(true));

        loadCommits(true);
    </script>
</body>
</html>
