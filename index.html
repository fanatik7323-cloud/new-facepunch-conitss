<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facepunch — Главные коммиты (RU)</title>
    <style>
        :root {
            --bg: #111317;
            --card: #1b1e24;
            --accent: #cd412b;
            --text: #e4e6eb;
            --muted: #8b929a;
            --like: #4caf50;
            --dislike: #ef5350;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2e37;
        }
        h1 { font-size: 1.5rem; color: #fff; }
        h1 span { color: var(--accent); }
        .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        button, label.toggle {
            background: var(--card);
            color: var(--text);
            border: 1px solid #323742;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        button:hover, label.toggle:hover { border-color: var(--accent); }
        .commit-list { display: flex; flex-direction: column; gap: 14px; }
        .commit-card {
            background: var(--card);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .commit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .author {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #fff;
        }
        .author img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
        }
        .branch-badge {
            background: #282c35;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #9cdcfe;
        }
        .tag-badge {
            background: rgba(205, 65, 43, 0.2);
            color: #ff7b66;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .commit-msg {
            font-size: 1.05rem;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            color: #fff;
        }
        .commit-orig {
            font-size: 0.85rem;
            line-height: 1.35;
            color: var(--muted);
            border-left: 2px solid #2e333d;
            padding-left: 10px;
            margin-top: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .commit-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .reactions { display: flex; gap: 10px; }
        .react-btn {
            background: #252932;
            border: 1px solid #323742;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .react-btn.like { color: var(--like); }
        .react-btn.dislike { color: var(--dislike); }
        .react-btn:hover { border-color: #555; }
        .status {
            text-align: center;
            color: var(--muted);
            padding: 40px 20px;
            background: var(--card);
            border-radius: 8px;
        }
        a.orig-link { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
        a.orig-link:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1><span>FACEPUNCH</span> ГЛАВНЫЕ КОММИТЫ</h1>
            <div class="subtitle">Условие: больше 2 👍 или больше 3 👎</div>
        </div>
        <div class="controls">
            <label class="toggle">
                <input type="checkbox" id="majorOnly" checked>
                Только важные (>2 👍 / >3 👎)
            </label>
            <label class="toggle">
                <input type="checkbox" id="autoTranslate" checked>
                🇷🇺 Автоперевод
            </label>
            <button id="refreshBtn">Обновить</button>
        </div>
    </header>

    <div id="commitsContainer" class="commit-list">
        <div class="status">Загрузка коммитов с Facepunch...</div>
    </div>

        const userVotes = JSON.parse(localStorage.getItem('fp_votes') || '{}');
        const translationCache = JSON.parse(localStorage.getItem('fp_ru_cache') || '{}');

        async function fetchFacepunchData() {
            const proxies = [
                async () => {
                    const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(TARGET_URL)}`);
                    if (!r.ok) throw new Error();
                    return await r.json();
                },
                async () => {
                    const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(TARGET_URL)}`);
                    if (!r.ok) throw new Error();
                    const d = await r.json();
                    return JSON.parse(d.contents);
                },
                async () => {
                    const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(TARGET_URL)}`);
                    if (!r.ok) throw new Error();
                    return await r.json();
                }
            ];

            for (const tryFetch of proxies) {
                try {
                    const data = await tryFetch();
                    if (data && Array.isArray(data.results)) return data.results;
                } catch (e) {}
            }
            throw new Error('Ошибка загрузки');
        }

                return translationCache[id];
